name: Windows Check

on:
  workflow_dispatch:

jobs:
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - run: npm ci

      - run: npm test

      - run: npm run build

      - run: cd src-tauri && cargo check --target x86_64-pc-windows-msvc

      - name: Test Windows directory junction fallback
        run: cd src-tauri && cargo run --target x86_64-pc-windows-msvc --example windows_junction_probe

      - name: Build Windows installer probe
        run: npm exec -- tauri build --target x86_64-pc-windows-msvc --config src-tauri/tauri.windows.conf.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: skilldock-windows-tauri-bundle
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**
          retention-days: 14
